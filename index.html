<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game of Thrones — Realms of Westeros</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
</head>
<body class="landing">

  <!-- Dynamic Ember Particles -->
  <canvas id="emberCanvas"></canvas>
  <div class="film-grain"></div>

  <div class="landing-content">
    <div class="sigil-container">
      <div class="sigil-ring"></div>
      <div class="sigil-ring delay"></div>
      <span class="sigil">🐉</span>
    </div>
    
    <h1 class="title-main">GAME OF THRONES</h1>
    <h2 class="title-sub">The Realms of Westeros</h2>
    <p class="motto">"When you play the game of thrones, you win or you die."</p>

    <a href="map.html" class="enter-btn">
      <span class="btn-text">Enter the Realm</span>
      <div class="sword-divider">
        <span>⚔</span>
      </div>
    </a>

    <div class="houses-strip">
      <span>STARK</span><span>·</span><span>LANNISTER</span><span>·</span>
      <span>TARGARYEN</span><span>·</span><span>BARATHEON</span><span>·</span>
      <span>TYRELL</span><span>·</span><span>MARTELL</span><span>·</span>
      <span>GREYJOY</span><span>·</span><span>ARRYN</span><span>·</span><span>TULLY</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
